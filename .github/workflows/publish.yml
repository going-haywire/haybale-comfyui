name: Publish

# Publishes every barn/* library to PyPI on a version tag, when the root
# pyproject.toml declares  [tool.haywire.marketstall] distribute = "pypi".
# With any other value the run ends green without publishing.
# To retry a failed run: gh workflow run publish.yml --ref vX.Y.Z

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  guard:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide what to publish
        id: plan
        run: python3 .github/publish_plan.py

  build:
    name: Build ${{ matrix.lib.dist }}
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lib: ${{ fromJSON(needs.guard.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      # Adapted by hand (as in haybale-spandrel): the root pyproject.toml is a dev-only
      # workspace whose [tool.uv.sources] point at a local haywire-repo checkout that does
      # not exist in CI, so nothing here loads it (no uv sync / uv run at the root).
      - name: Build wheel and sdist
        working-directory: barn/${{ matrix.lib.dist }}
        run: |
          rm -rf "${GITHUB_WORKSPACE}/dist"
          uv build --out-dir "${GITHUB_WORKSPACE}/dist"
      # Installing the wheel into a clean venv resolves its dependencies against PyPI,
      # which a local editable checkout never checks. The tests then run against it;
      # those that need a ComfyUI server skip without COMFYUI_URL.
      - name: Test the built wheel
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} /tmp/check
          VIRTUAL_ENV=/tmp/check uv pip install dist/*.whl pytest pytest-timeout
          if [ -d tests ]; then /tmp/check/bin/python -m pytest -q -p no:cacheprovider; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.lib.dist }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.lib.dist }}
    needs: [guard, build]
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lib: ${{ fromJSON(needs.guard.outputs.matrix) }}
    environment:
      name: pypi
      url: https://pypi.org/project/${{ matrix.lib.dist }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.lib.dist }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
