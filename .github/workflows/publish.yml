name: Publish

# Publishes every barn/* library to PyPI on a version tag, when the root
# pyproject.toml declares  [tool.haywire.marketstall] distribute = "pypi".
# With any other value the run ends green without publishing.
# A push to the default branch that changes the versions (the merge of a release PR)
# tests, builds, tags the merge commit and publishes in this one run.
# To retry a failed run: gh workflow run publish.yml --ref vX.Y.Z

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
      - master
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  guard:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      matrix: ${{ steps.plan.outputs.matrix }}
      standalone: ${{ steps.plan.outputs.standalone }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide what to publish
        id: plan
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 .github/publish_plan.py

  build:
    name: Build ${{ matrix.lib.dist }}
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lib: ${{ fromJSON(needs.guard.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      # The tests need a root that resolves its own dependencies. A --dev project's root
      # links to a haywire checkout by path, which a runner does not have: run them locally.
      - name: Run tests
        if: needs.guard.outputs.standalone == 'true' && hashFiles('tests/**') != ''
        run: |
          uv sync --frozen
          uv run --frozen pytest -q
      - name: Build wheel and sdist
        working-directory: ${{ matrix.lib.path }}
        run: uv build --out-dir "${GITHUB_WORKSPACE}/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.lib.dist }}
          path: dist/
          if-no-files-found: error

  # A clean environment resolves every dependency from PyPI, as a consumer's install does;
  # the project's path sources and lock play no part. The wheels go in together, so
  # libraries released side by side find each other.
  smoke:
    name: Install and load the wheels
    needs: [guard, build]
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - uses: astral-sh/setup-uv@v3
      - name: Install the wheels
        run: |
          uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/smoke"
          VIRTUAL_ENV="$RUNNER_TEMP/smoke" uv pip install dist/*.whl
      - name: Load every library as the studio does
        env:
          MATRIX: ${{ needs.guard.outputs.matrix }}
        run: |
          "$RUNNER_TEMP/smoke/bin/python" - <<'PY'
          import importlib.metadata
          import json
          import os

          for lib in json.loads(os.environ["MATRIX"]):
              dist = importlib.metadata.distribution(lib["dist"])
              points = [ep for ep in dist.entry_points if ep.group == "haywire.libraries"]
              if not points:
                  raise SystemExit(f"{lib['dist']} declares no haywire.libraries entry point")
              for point in points:
                  point.load()
                  print(f"{lib['dist']}: loaded {point.name} = {point.value}")
          PY

  tag:
    name: Tag ${{ needs.guard.outputs.tag }}
    needs: [guard, build, smoke]
    if: needs.guard.outputs.enabled == 'true' && needs.guard.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the merge commit
        env:
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

  publish:
    name: Publish ${{ matrix.lib.dist }}
    needs: [guard, build, smoke, tag]
    if: >-
      ${{ !cancelled()
      && needs.guard.outputs.enabled == 'true'
      && needs.build.result == 'success'
      && needs.smoke.result == 'success'
      && needs.tag.result != 'failure' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lib: ${{ fromJSON(needs.guard.outputs.matrix) }}
    environment:
      name: pypi
      url: https://pypi.org/project/${{ matrix.lib.dist }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.lib.dist }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
