[project]
name = "haybale-comfyui-dev"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [ "haywire-studio>=0.3.4", "haybale-studio>=0.3.4", "haybale-marketplace>=0.3.4", "haybale-comfyui",]

[tool.uv.workspace]
members = [ "barn/*",]

[tool.uv.sources.haybale-comfyui]
workspace = true

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout", "ruff==0.12.12"]

[tool.ruff]
line-length = 109

[tool.ruff.lint]
extend-select = ["E501", "PT", "B", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the full library system"]
addopts = "--strict-markers --tb=short"
timeout = 120
