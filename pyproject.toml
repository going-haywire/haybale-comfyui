[project]
name = "haybale-comfyui-dev"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [ "haywire-studio>=0.6.0", "haybale-studio>=0.6.0", "haybale-marketplace>=0.6.0", "haybale-comfyui", "haybale-core", "haybale-image", "haybale-graph-editor", "haybale-haystack",]

[tool.uv.workspace]
members = [ "barn/*",]

[tool.uv.sources.haybale-comfyui]
workspace = true

[tool.uv.sources.haywire-studio]
path = "../haywire-repo/packages/haywire-studio"
editable = true

[tool.uv.sources.haywire-core]
path = "../haywire-repo/packages/haywire-core"
editable = true

[tool.uv.sources.haybale-core]
path = "../haywire-repo/barn/haybale-core"
editable = true

[tool.uv.sources.haybale-studio]
path = "../haywire-repo/barn/haybale-studio"
editable = true

[tool.uv.sources.haybale-marketplace]
path = "../haywire-repo/barn/haybale-marketplace"
editable = true

[tool.uv.sources.haybale-image]
path = "../haywire-repo/barn/haybale-image"
editable = true

[tool.uv.sources.haybale-graph-editor]
path = "../haywire-repo/barn/haybale-graph-editor"
editable = true

[tool.uv.sources.haybale-haystack]
path = "../haywire-repo/barn/haybale-haystack"
editable = true

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout", "ruff==0.12.12"]

[tool.ruff]
line-length = 109
# Throwaway experiments against a ComfyUI server; not part of the library.
extend-exclude = ["spike"]

[tool.ruff.lint]
extend-select = ["E501", "PT", "B", "TID251", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"haywire.core".msg = "Import from haywire.api or haywire.api.workbench; this module is internal and may change."
"haywire.ui".msg = "Import from haywire.api or haywire.api.workbench; this module is internal and may change."
"haywire.barn".msg = "Import from haywire.api or haywire.api.workbench; this module is internal and may change."

[tool.ruff.lint.per-file-ignores]
# The test fixtures build a library system from haywire's DI internals, which the
# Author API does not cover. Library code under barn/ stays on the Author API.
"tests/conftest.py" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the full library system"]
addopts = "--strict-markers --tb=short"
timeout = 120

[tool.haywire.marketstall]
# Released wheels go to PyPI, so every marketstall row carries
# `haybale-comfyui==<version>` rather than a git clone spec.
distribute = "pypi"
