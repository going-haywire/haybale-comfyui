[project]
name = "haybale-comfyui-dev"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [ "haywire-studio>=0.3.4", "haybale-studio>=0.3.4", "haybale-marketplace>=0.3.4", "haybale-comfyui", "haybale-core", "haybale-image", "haybale-graph-editor", "haybale-haystack",]

[tool.uv.workspace]
members = [ "barn/*",]

[tool.uv.sources.haybale-comfyui]
workspace = true

[tool.uv.sources.haywire-studio]
path = "/home/maybites/Work/going-haywire/haywire-repo/packages/haywire-studio"
editable = true

[tool.uv.sources.haywire-core]
path = "/home/maybites/Work/going-haywire/haywire-repo/packages/haywire-core"
editable = true

[tool.uv.sources.haybale-core]
path = "/home/maybites/Work/going-haywire/haywire-repo/barn/haybale-core"
editable = true

[tool.uv.sources.haybale-studio]
path = "/home/maybites/Work/going-haywire/haywire-repo/barn/haybale-studio"
editable = true

[tool.uv.sources.haybale-marketplace]
path = "/home/maybites/Work/going-haywire/haywire-repo/barn/haybale-marketplace"
editable = true

[tool.uv.sources.haybale-image]
path = "/home/maybites/Work/going-haywire/haywire-repo/barn/haybale-image"
editable = true

[tool.uv.sources.haybale-graph-editor]
path = "/home/maybites/Work/going-haywire/haywire-repo/barn/haybale-graph-editor"
editable = true

[tool.uv.sources.haybale-haystack]
path = "/home/maybites/Work/going-haywire/haywire-repo/barn/haybale-haystack"
editable = true

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout", "ruff==0.12.12"]

[tool.ruff]
line-length = 109

[tool.ruff.lint]
extend-select = ["E501", "PT", "B", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the full library system"]
addopts = "--strict-markers --tb=short"
timeout = 120

[tool.haywire.marketstall]
# Released wheels go to PyPI, so every marketstall row carries
# `haybale-comfyui==<version>` rather than a git clone spec.
distribute = "pypi"
